<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>厨房 Kitchen — 隐私政策 / Privacy Policy</title>
  <meta name="description" content="厨房 Kitchen iOS app 的隐私政策与法律信息 / Privacy Policy for the Kitchen iOS app." />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.min.css"
    crossorigin="anonymous"
  />
  <style>
    :root { color-scheme: light dark; }
    body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 64px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #c9d1d9; }
    }
    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      .topbar { border-bottom-color: #30363d; }
    }
    .topbar h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .topbar a {
      font-size: 13px;
      text-decoration: none;
      color: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      .topbar a { color: #58a6ff; }
    }
    #content { word-wrap: break-word; }
    #content.markdown-body { background: transparent; }
    .loading, .error {
      padding: 48px 0;
      text-align: center;
      color: #57606a;
    }
    .error { color: #cf222e; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>厨房 Kitchen — 法律文档 / Legal</h1>
    <a href="PRIVACY_POLICY.md">View raw Markdown</a>
  </div>

  <article id="content" class="markdown-body">
    <p class="loading">Loading privacy policy…</p>
  </article>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      var target = document.getElementById("content");
      fetch("PRIVACY_POLICY.md", { cache: "no-cache" })
        .then(function (resp) {
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.text();
        })
        .then(function (md) {
          if (typeof marked === "undefined") {
            target.innerHTML = "<pre></pre>";
            target.querySelector("pre").textContent = md;
            return;
          }
          marked.setOptions({ gfm: true, breaks: false });
          target.innerHTML = marked.parse(md);
        })
        .catch(function (err) {
          target.innerHTML =
            '<p class="error">Failed to load privacy policy: ' +
            (err && err.message ? err.message : String(err)) +
            "</p>";
        });
    })();
  </script>
</body>
</html>
